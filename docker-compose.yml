version: "3.8"

services:
  # Dragonfly (Redis-compatible high-performance data store)
  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    container_name: portask-dragonfly
    ports:
      - "6379:6379"
    volumes:
      - dragonfly-data:/data
    command: --logtostderr --snapshot_cron "*/30 * * * *"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - portask-network

  # Portask Server
  portask:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portask-server
    ports:
      - "8080:8080" # HTTP API
      - "9092:9092" # Kafka-compatible
      - "5672:5672" # RabbitMQ-compatible
      - "9090:9090" # Metrics
    environment:
      - PORTASK_STORAGE_TYPE=dragonfly
      - PORTASK_STORAGE_DRAGONFLY_ADDRESSES=dragonfly:6379
      - PORTASK_PERFORMANCE_WORKER_POOL_SIZE=32
      - PORTASK_MONITORING_ENABLED=true
    volumes:
      - ./configs:/app/configs:ro
    depends_on:
      dragonfly:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - portask-network
    restart: unless-stopped

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: portask-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    networks:
      - portask-network
    restart: unless-stopped

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: portask-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./deploy/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - portask-network
    restart: unless-stopped

volumes:
  dragonfly-data:
  prometheus-data:
  grafana-data:

networks:
  portask-network:
    driver: bridge
