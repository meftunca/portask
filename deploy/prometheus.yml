global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: "portask"
    environment: "production"

# Alertmanager configuration (optional)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           - localhost:9093

# Load rules once and periodically evaluate them
rule_files:
  # - "alerts/*.yml"

scrape_configs:
  # Portask main metrics
  - job_name: "portask"
    static_configs:
      - targets: ["portask:9090"]
    metrics_path: "/metrics"
    scrape_interval: 5s
    scrape_timeout: 5s

  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Dragonfly metrics (if exposed)
  - job_name: "dragonfly"
    static_configs:
      - targets: ["dragonfly:6379"]
    metrics_path: "/metrics"
